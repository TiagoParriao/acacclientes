<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin — ACAC</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div class="logo">
    <img src="../assets/logo-empresa.png" alt="Logo ACAC">
  </div>

  <div class="container">
    <div class="card">
      <h1>Painel Administrativo</h1>
      <p class="subtitulo">Acesso restrito a gestores da associação.</p>

      <form id="form-login">
        <label for="email">E-mail</label>
        <input type="email" id="email" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" required>

        <button type="submit" class="btn" id="btn-entrar">Entrar</button>
      </form>

      <div id="mensagem" class="mensagem erro" style="display:none;"></div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="../assets/supabase-client.js"></script>
  <script src="login.js"></script>
</body>
</html>
