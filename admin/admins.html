<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administradores — Painel Admin ACAC</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div class="logo">
    <img src="../assets/logo-empresa.png" alt="Logo ACAC">
  </div>

  <div class="container">
    <div class="admin-topo">
      <h1>Administradores</h1>
      <div class="acoes-linha">
        <a href="dashboard.html" class="btn btn-secundario btn-pequeno">Painel (todos os filiados)</a>
        <button type="button" class="btn btn-secundario btn-pequeno" id="btn-sair">Sair</button>
      </div>
    </div>

    <div class="card">
      <h2>Convidar novo admin</h2>
      <p class="subtitulo" style="margin-bottom:12px;">A pessoa poderá logar imediatamente com o e-mail e a senha definidos aqui.</p>

      <form id="form-novo-admin">
        <label for="nome">Nome</label>
        <input type="text" id="nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" required>

        <label for="senha">Senha provisória</label>
        <input type="text" id="senha" required minlength="8" placeholder="Mínimo 8 caracteres">

        <button type="submit" class="btn" id="btn-criar">Criar admin</button>
      </form>

      <div id="mensagem" class="mensagem" style="display:none;"></div>
    </div>

    <div class="card">
      <h2>Admins atuais</h2>
      <ul class="historico-lista" id="lista-admins">
        <li>Carregando...</li>
      </ul>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../config.js?v=2"></script>
  <script src="../assets/supabase-client.js?v=2"></script>
  <script src="admin-common.js?v=2"></script>
  <script src="admins.js?v=2"></script>
</body>
</html>
